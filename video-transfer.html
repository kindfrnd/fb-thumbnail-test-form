<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>FB Video Transfer POST test</title></head>
<body>
<h2>FB Video Transfer POST test</h2>
<p>Transfers video bytes (raw body, fetch) to the rupload URL from a resumable upload start.</p>
<label>Upload URL: <input type="text" id="url" size="110" value="https://rupload.facebook.com/video-upload/v27.0/2286481131917023"></label><br><br>
<label>Access token: <input type="text" id="tok" size="90"></label><br><br>
<label>Video file: <input type="file" id="file"></label><br><br>
<button id="go" type="button">Transfer bytes</button>
<pre id="out"></pre>
<script>
document.getElementById('go').addEventListener('click', async function(){
  var out = document.getElementById('out');
  var f = document.getElementById('file').files[0];
  if(!f){ out.textContent = 'No file chosen'; return; }
  var url = document.getElementById('url').value.trim();
  var tok = document.getElementById('tok').value.trim();
  out.textContent = 'Uploading ' + f.size + ' bytes...';
  try {
    var res = await fetch(url, {method:'POST', headers:{'Authorization':'OAuth '+tok, 'X-Facebook-Upload-Phase':'transfer', 'X-Facebook-Upload-Start-Offset':'0', 'X-Facebook-Upload-End-Offset': String(f.size)}, body: f});
    var txt = await res.text();
    out.textContent = 'HTTP ' + res.status + '\n' + txt;
  } catch(e) {
    out.textContent = 'FETCH ERROR: ' + e;
  }
});
</script>
</body>
</html>
